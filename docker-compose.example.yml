# Contoh compose untuk STB. Salin menjadi docker-compose.yml lalu sesuaikan:
# - nama network dengan network stack FamilyRoots yang sudah ada
# - FAMILY_API_BASE_URL di .env ke nama container API yang benar
#
# Kalau Nouride berjalan di host (bukan container), buka ports 127.0.0.1:3100
# dan arahkan Nouride ke http://127.0.0.1:3100/mcp.
# Kalau Nouride juga di Docker, taruh di network yang sama dan pakai
# http://family-mcp:3100/mcp.

services:
  family-mcp:
    build:
      context: .
    image: family-tree-mcp:local
    container_name: family-mcp
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3100"
    # ports:
    #   - "127.0.0.1:3100:3100"
    networks:
      - family
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  family:
    external: true
    name: family-suite_default
