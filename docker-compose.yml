services:
  family-mcp:
    build: .
    image: family-tree-mcp:latest
    container_name: family-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    expose:
      - "3100"
    # Publish ke host supaya bisa dicek dari STB / perangkat lain di LAN.
    # Kalau hanya ingin bisa diakses dari server sendiri, ganti jadi:
    #   - "127.0.0.1:3100:3100"
    ports:
      - "3100:3100"
    init: true
    stop_grace_period: 15s
    networks:
      - shared_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Network external yang sama dengan family-tree-api.
  shared_net:
    external: true
